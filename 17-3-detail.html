<!DOCTYPE html>
<!-- 姓名：高浩哲，日期：2026-11-02，功能：17-3 商品详情页，根据 URL 中的 id 用 fetch 获取单个商品并展示 -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17-3 商品详情 · 高浩哲</title>
    <style>
        :root {
            --ghz_bg: #f4f7fb;
            --ghz_card: #ffffff;
            --ghz_ink: #16203a;
            --ghz_muted: #68738c;
            --ghz_line: #e3e8f2;
            --ghz_primary: #2f6bd6;
            --ghz_primary-deep: #1d47a2;
            --ghz_amber: #ef9d35;
            --ghz_red: #d64545;
            --ghz_green: #16996f;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px 16px 46px;
            font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
            color: var(--ghz_ink);
            background:
                radial-gradient(circle at top left, rgba(47, 107, 214, 0.13), transparent 30%),
                radial-gradient(circle at bottom right, rgba(239, 157, 53, 0.12), transparent 28%),
                var(--ghz_bg);
        }

        .ghz_page {
            width: min(1080px, 100%);
            margin: 0 auto;
        }

        /* ---------- 面包屑 ---------- */
        .ghz_crumb {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
            font-size: 0.78rem;
            color: var(--ghz_muted);
        }

        .ghz_crumb a {
            color: var(--ghz_primary-deep);
            text-decoration: none;
        }

        .ghz_crumb a:hover {
            text-decoration: underline;
        }

        .ghz_crumb span {
            color: #b3bbd0;
        }

        /* ---------- 详情主体 ---------- */
        .ghz_detail {
            display: grid;
            grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr);
            gap: 26px;
            padding: 24px;
            border: 1px solid var(--ghz_line);
            border-radius: 24px;
            background: var(--ghz_card);
            box-shadow: 0 16px 36px rgba(28, 45, 90, 0.09);
        }

        /* 图片区 */
        .ghz_gallery {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .ghz_main-img {
            position: relative;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border-radius: 16px;
            background: linear-gradient(150deg, #eef2fb, #dde6f6);
        }

        .ghz_main-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .ghz_thumbs {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 10px;
        }

        .ghz_thumb {
            padding: 0;
            border: 2px solid transparent;
            border-radius: 10px;
            overflow: hidden;
            background: #eef2fb;
            cursor: pointer;
            aspect-ratio: 1 / 1;
            transition: border-color 0.16s ease, transform 0.16s ease;
        }

        .ghz_thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .ghz_thumb:hover {
            transform: translateY(-2px);
        }

        .ghz_thumb--active {
            border-color: var(--ghz_primary);
        }

        .ghz_thumb:focus-visible {
            outline: 2px dashed var(--ghz_primary);
            outline-offset: 2px;
        }

        /* 信息区 */
        .ghz_info {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .ghz_pills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .ghz_pill {
            padding: 3px 10px;
            border-radius: 999px;
            background: #eef3fd;
            color: var(--ghz_primary-deep);
            font-size: 0.72rem;
            letter-spacing: 0.5px;
        }

        .ghz_pill--green {
            background: rgba(22, 153, 111, 0.12);
            color: #0f7357;
        }

        .ghz_title {
            margin: 12px 0 0;
            font-size: clamp(1.3rem, 2.6vw, 1.75rem);
            line-height: 1.4;
            letter-spacing: 0.5px;
        }

        .ghz_subline {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 14px;
            margin-top: 10px;
            font-size: 0.78rem;
            color: var(--ghz_muted);
        }

        .ghz_stars {
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        .ghz_stars svg {
            width: 13px;
            height: 13px;
            fill: var(--ghz_amber);
        }

        .ghz_stars > span {
            display: inline-flex;
        }

        .ghz_stars .ghz_star-dim svg {
            fill: #dde3ef;
        }

        .ghz_stars b {
            margin-left: 4px;
            color: #b97614;
            font-weight: 700;
        }

        .ghz_price-box {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 18px;
            padding: 14px 16px;
            border-radius: 14px;
            background: linear-gradient(135deg, #fff7ec, #fff1dc);
            border: 1px solid rgba(239, 157, 53, 0.35);
        }

        .ghz_price-now {
            font-size: 1.9rem;
            font-weight: 700;
            color: #c2691a;
            letter-spacing: 0.5px;
        }

        .ghz_price-old {
            font-size: 0.85rem;
            color: #9aa2b8;
            text-decoration: line-through;
        }

        .ghz_off {
            padding: 3px 9px;
            border-radius: 999px;
            background: rgba(214, 69, 69, 0.12);
            color: #b23636;
            font-size: 0.73rem;
        }

        .ghz_desc {
            margin: 16px 0 0;
            font-size: 0.85rem;
            line-height: 1.9;
            color: #4b5670;
        }

        .ghz_tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
        }

        .ghz_tag {
            padding: 4px 10px;
            border: 1px solid var(--ghz_line);
            border-radius: 8px;
            font-size: 0.73rem;
            color: var(--ghz_muted);
        }

        .ghz_actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            margin-top: 20px;
        }

        .ghz_btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 18px;
            border: 0;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--ghz_primary), var(--ghz_primary-deep));
            color: #fff;
            font-family: inherit;
            font-size: 0.83rem;
            letter-spacing: 0.5px;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(47, 107, 214, 0.28);
            transition: transform 0.16s ease, box-shadow 0.16s ease;
        }

        .ghz_btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(47, 107, 214, 0.34);
        }

        .ghz_btn svg {
            width: 13px;
            height: 13px;
            fill: currentColor;
        }

        .ghz_btn--ghost {
            background: #fff;
            border: 1px solid rgba(47, 107, 214, 0.35);
            color: var(--ghz_primary-deep);
            box-shadow: none;
        }

        .ghz_btn--ghost:hover {
            background: #f2f6ff;
            box-shadow: none;
        }

        /* ---------- 规格与评价 ---------- */
        .ghz_section {
            margin-top: 22px;
            padding: 22px 24px 24px;
            border: 1px solid var(--ghz_line);
            border-radius: 20px;
            background: var(--ghz_card);
            box-shadow: 0 12px 28px rgba(28, 45, 90, 0.06);
        }

        .ghz_section-title {
            display: flex;
            align-items: center;
            gap: 9px;
            margin: 0 0 16px;
            font-size: 1rem;
        }

        .ghz_section-title::before {
            content: "";
            width: 4px;
            height: 15px;
            border-radius: 3px;
            background: var(--ghz_primary);
        }

        .ghz_specs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 12px;
        }

        .ghz_spec {
            padding: 12px 14px;
            border-radius: 12px;
            background: #f7f9fe;
            border: 1px solid #edf1f9;
        }

        .ghz_spec span {
            display: block;
            margin-bottom: 5px;
            font-size: 0.72rem;
            color: var(--ghz_muted);
        }

        .ghz_spec b {
            font-size: 0.85rem;
            font-weight: 600;
            word-break: break-word;
        }

        .ghz_reviews {
            display: grid;
            gap: 12px;
        }

        .ghz_review {
            padding: 14px 16px;
            border: 1px solid #edf1f9;
            border-radius: 12px;
            background: #fbfcff;
        }

        .ghz_review-head {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            font-size: 0.8rem;
        }

        .ghz_review-head b {
            color: var(--ghz_primary-deep);
        }

        .ghz_review-head span {
            color: #b97614;
            font-size: 0.76rem;
        }

        .ghz_review p {
            margin: 8px 0 0;
            font-size: 0.79rem;
            line-height: 1.8;
            color: #4b5670;
        }

        /* ---------- 状态提示 ---------- */
        .ghz_state {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 0.8rem;
            border: 1px solid transparent;
        }

        .ghz_state::before {
            content: "";
            width: 8px;
            height: 8px;
            flex: none;
            border-radius: 50%;
            background: currentColor;
        }

        .ghz_state--loading {
            color: #8a6216;
            background: rgba(239, 157, 53, 0.1);
            border-color: rgba(239, 157, 53, 0.32);
        }

        .ghz_state--ok {
            color: #0f7357;
            background: rgba(22, 153, 111, 0.1);
            border-color: rgba(22, 153, 111, 0.3);
        }

        .ghz_state--error {
            color: #a93232;
            background: rgba(214, 69, 69, 0.09);
            border-color: rgba(214, 69, 69, 0.3);
        }

        /* 骨架屏 */
        .ghz_skeleton-img {
            aspect-ratio: 1 / 1;
            border-radius: 16px;
            background: linear-gradient(100deg, #f2f5fb 20%, #e8edf8 40%, #f2f5fb 60%);
            background-size: 200% 100%;
            animation: ghz_shimmer 1.3s linear infinite;
        }

        .ghz_skeleton-line {
            height: 18px;
            margin-bottom: 14px;
            border-radius: 8px;
            background: linear-gradient(100deg, #f2f5fb 20%, #e8edf8 40%, #f2f5fb 60%);
            background-size: 200% 100%;
            animation: ghz_shimmer 1.3s linear infinite;
        }

        .ghz_skeleton-line--short {
            width: 55%;
        }

        @keyframes ghz_shimmer {
            from { background-position: 180% 0; }
            to { background-position: -20% 0; }
        }

        /* 错误面板 */
        .ghz_empty {
            padding: 46px 24px;
            text-align: center;
            border: 1px dashed #d7ddea;
            border-radius: 20px;
            background: #fbfcff;
            color: var(--ghz_muted);
            font-size: 0.87rem;
            line-height: 1.9;
        }

        .ghz_empty strong {
            display: block;
            margin-bottom: 8px;
            color: var(--ghz_red);
            font-size: 1rem;
        }

        .ghz_empty .ghz_btn {
            margin-top: 16px;
        }

        /* ---------- 原始数据 ---------- */
        .ghz_panel {
            margin-top: 22px;
            border: 1px solid var(--ghz_line);
            border-radius: 16px;
            overflow: hidden;
            background: var(--ghz_card);
        }

        .ghz_panel summary {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px 18px;
            cursor: pointer;
            list-style: none;
            font-size: 0.86rem;
            font-weight: 700;
            color: var(--ghz_primary-deep);
        }

        .ghz_panel summary::-webkit-details-marker {
            display: none;
        }

        .ghz_panel summary::before {
            content: "＋";
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            border-radius: 6px;
            background: rgba(47, 107, 214, 0.1);
            font-size: 0.72rem;
        }

        .ghz_panel[open] summary::before {
            content: "−";
        }

        .ghz_panel summary em {
            margin-left: auto;
            font-style: normal;
            font-weight: 400;
            font-size: 0.74rem;
            color: #93a0bd;
        }

        .ghz_raw {
            margin: 0;
            padding: 16px 18px;
            max-height: 380px;
            overflow: auto;
            background: #12192a;
            color: #cfd7ea;
            font-family: Consolas, "Courier New", monospace;
            font-size: 0.78rem;
            line-height: 1.7;
        }

        .ghz_key { color: #8bd0ff; }
        .ghz_str { color: #a8e6a1; }
        .ghz_num { color: #ffb86c; }
        .ghz_bool { color: #ff8fb1; }
        .ghz_null { color: #b39ddb; }

        .ghz_footer {
            margin-top: 22px;
            text-align: center;
            font-size: 0.76rem;
            letter-spacing: 1px;
            color: #9aa2b8;
        }

        @media (max-width: 820px) {
            .ghz_detail {
                grid-template-columns: 1fr;
                padding: 18px;
            }

            .ghz_main-img {
                aspect-ratio: 4 / 3;
            }
        }

        @media (max-width: 560px) {
            body {
                padding: 16px 10px 30px;
            }

            .ghz_section {
                padding: 18px 16px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="ghz_page">
        <nav class="ghz_crumb">
            <a href="./17-3.html">商品列表</a>
            <span>›</span>
            <span>商品详情</span>
            <span>›</span>
            <span id="ghz_crumb-id">ID 1</span>
        </nav>

        <div class="ghz_state ghz_state--loading" id="ghz_state">正在请求商品详情…</div>

        <!-- 详情主体 -->
        <section class="ghz_detail" id="ghz_detail" aria-live="polite"></section>

        <!-- 规格与评价 -->
        <div id="ghz_extra"></div>

        <!-- 接口原始数据 -->
        <details class="ghz_panel">
            <summary>接口返回的原始 JSON<em>https://dummyjson.com/products/{id}</em></summary>
            <pre class="ghz_raw" id="ghz_raw">尚无数据</pre>
        </details>

        <p class="ghz_footer">高浩哲 · 《高级网页设计》练习 17-3 · 商品详情页</p>
    </div>

    <script>
        // 从地址栏读取商品 id，没有参数时默认 1
        var ghz_id = new URLSearchParams(location.search).get('id') || '1';
        var ghz_apiUrl = 'https://dummyjson.com/products/' + encodeURIComponent(ghz_id);

        var ghz_state = document.getElementById('ghz_state');
        var ghz_detail = document.getElementById('ghz_detail');
        var ghz_extra = document.getElementById('ghz_extra');
        var ghz_raw = document.getElementById('ghz_raw');

        document.getElementById('ghz_crumb-id').textContent = 'ID ' + ghz_id;

        function ghz_escape(ghz_text) {
            return String(ghz_text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function ghz_highlight(ghz_text) {
            var ghz_escaped = ghz_text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');

            return ghz_escaped.replace(
                /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
                function (ghz_match) {
                    var ghz_cls = 'ghz_num';
                    if (/^"/.test(ghz_match)) {
                        ghz_cls = /:$/.test(ghz_match) ? 'ghz_key' : 'ghz_str';
                    } else if (/true|false/.test(ghz_match)) {
                        ghz_cls = 'ghz_bool';
                    } else if (/null/.test(ghz_match)) {
                        ghz_cls = 'ghz_null';
                    }
                    return '<span class="' + ghz_cls + '">' + ghz_match + '</span>';
                }
            );
        }

        function ghz_setState(ghz_text, ghz_kind) {
            ghz_state.textContent = ghz_text;
            ghz_state.className = 'ghz_state ghz_state--' + ghz_kind;
        }

        // 五角星图标（每颗 13px）
        var ghz_starSvg = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4 6.2 20.5l1.1-6.5L2.6 9.4l6.5-.9z"/></svg>';

        function ghz_starsHtml(ghz_rating) {
            var ghz_html = '';
            var ghz_full = Math.round(ghz_rating);

            for (var ghz_i = 0; ghz_i < 5; ghz_i++) {
                ghz_html += '<span class="' + (ghz_i < ghz_full ? '' : 'ghz_star-dim') + '">' + ghz_starSvg + '</span>';
            }

            return '<span class="ghz_stars">' + ghz_html + '<b>' + ghz_rating.toFixed(2) + '</b></span>';
        }

        // 骨架屏
        function ghz_showSkeleton() {
            ghz_detail.innerHTML =
                '<div class="ghz_gallery"><div class="ghz_skeleton-img"></div></div>' +
                '<div class="ghz_info">' +
                    '<div class="ghz_skeleton-line ghz_skeleton-line--short"></div>' +
                    '<div class="ghz_skeleton-line"></div>' +
                    '<div class="ghz_skeleton-line"></div>' +
                    '<div class="ghz_skeleton-line ghz_skeleton-line--short"></div>' +
                '</div>';
            ghz_extra.innerHTML = '';
        }

        // 渲染详情
        function ghz_render(ghz_p) {
            var ghz_images = ghz_p.images && ghz_p.images.length ? ghz_p.images : [ghz_p.thumbnail];
            var ghz_thumbs = '';

            for (var ghz_i = 0; ghz_i < ghz_images.length; ghz_i++) {
                ghz_thumbs +=
                    '<button class="ghz_thumb' + (ghz_i === 0 ? ' ghz_thumb--active' : '') + '" type="button" data-ghz-img="' + ghz_escape(ghz_images[ghz_i]) + '">' +
                        '<img src="' + ghz_escape(ghz_images[ghz_i]) + '" alt="商品图 ' + (ghz_i + 1) + '" loading="lazy" onerror="this.style.opacity=0">' +
                    '</button>';
            }

            var ghz_tagsHtml = '';
            if (ghz_p.tags && ghz_p.tags.length) {
                for (var ghz_j = 0; ghz_j < ghz_p.tags.length; ghz_j++) {
                    ghz_tagsHtml += '<span class="ghz_tag">#' + ghz_escape(ghz_p.tags[ghz_j]) + '</span>';
                }
            }

            var ghz_oldPrice = Number(ghz_p.price) / (1 - Number(ghz_p.discountPercentage) / 100);

            ghz_detail.innerHTML =
                '<div class="ghz_gallery">' +
                    '<div class="ghz_main-img"><img id="ghz_main-img" src="' + ghz_escape(ghz_images[0]) + '" alt="' + ghz_escape(ghz_p.title) + '" onerror="this.style.opacity=0"></div>' +
                    '<div class="ghz_thumbs">' + ghz_thumbs + '</div>' +
                '</div>' +
                '<div class="ghz_info">' +
                    '<div class="ghz_pills">' +
                        '<span class="ghz_pill">' + ghz_escape(ghz_p.category) + '</span>' +
                        (ghz_p.brand ? '<span class="ghz_pill">品牌 ' + ghz_escape(ghz_p.brand) + '</span>' : '') +
                        '<span class="ghz_pill ghz_pill--green">' + ghz_escape(ghz_p.availabilityStatus) + '</span>' +
                    '</div>' +
                    '<h1 class="ghz_title">' + ghz_escape(ghz_p.title) + '</h1>' +
                    '<div class="ghz_subline">' +
                        ghz_starsHtml(Number(ghz_p.rating)) +
                        '<span>SKU：' + ghz_escape(ghz_p.sku) + '</span>' +
                        '<span>库存 ' + ghz_p.stock + ' 件</span>' +
                    '</div>' +
                    '<div class="ghz_price-box">' +
                        '<span class="ghz_price-now">$ ' + Number(ghz_p.price).toFixed(2) + '</span>' +
                        '<span class="ghz_price-old">$ ' + ghz_oldPrice.toFixed(2) + '</span>' +
                        '<span class="ghz_off">省 ' + Number(ghz_p.discountPercentage).toFixed(1) + '%</span>' +
                    '</div>' +
                    '<p class="ghz_desc">' + ghz_escape(ghz_p.description) + '</p>' +
                    '<div class="ghz_tags">' + ghz_tagsHtml + '</div>' +
                    '<div class="ghz_actions">' +
                        '<a class="ghz_btn" href="./17-3.html">' +
                            '返回列表' +
                            '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.3 5.3l1.4 1.4L10.1 11H19v2h-8.9l4.6 4.3-1.4 1.4L7 12l6.3-6.7z"/></svg>' +
                        '</a>' +
                        '<a class="ghz_btn ghz_btn--ghost" href="' + ghz_escape(ghz_images[0]) + '" target="_blank" rel="noopener">查看大图</a>' +
                    '</div>' +
                '</div>';

            // 规格卡片
            var ghz_specs = [
                { ghz_name: '重量', ghz_value: ghz_p.weight + ' g' },
                { ghz_name: '尺寸', ghz_value: ghz_p.dimensions.width + ' × ' + ghz_p.dimensions.height + ' × ' + ghz_p.dimensions.depth + ' mm' },
                { ghz_name: '保修信息', ghz_value: ghz_p.warrantyInformation },
                { ghz_name: '配送信息', ghz_value: ghz_p.shippingInformation },
                { ghz_name: '退货政策', ghz_value: ghz_p.returnPolicy },
                { ghz_name: '最小起订量', ghz_value: ghz_p.minimumOrderQuantity + ' 件' }
            ];

            var ghz_specsHtml = '';
            for (var ghz_k = 0; ghz_k < ghz_specs.length; ghz_k++) {
                ghz_specsHtml +=
                    '<div class="ghz_spec">' +
                        '<span>' + ghz_specs[ghz_k].ghz_name + '</span>' +
                        '<b>' + ghz_escape(ghz_specs[ghz_k].ghz_value) + '</b>' +
                    '</div>';
            }

            // 用户评价
            var ghz_reviewsHtml = '';
            if (ghz_p.reviews && ghz_p.reviews.length) {
                for (var ghz_m = 0; ghz_m < ghz_p.reviews.length; ghz_m++) {
                    var ghz_r = ghz_p.reviews[ghz_m];
                    ghz_reviewsHtml +=
                        '<div class="ghz_review">' +
                            '<div class="ghz_review-head">' +
                                '<b>' + ghz_escape(ghz_r.reviewerName) + '</b>' +
                                '<span>评分 ' + Number(ghz_r.rating).toFixed(1) + '</span>' +
                                '<span>' + ghz_escape(String(ghz_r.date).slice(0, 10)) + '</span>' +
                            '</div>' +
                            '<p>' + ghz_escape(ghz_r.comment) + '</p>' +
                        '</div>';
                }
            }

            ghz_extra.innerHTML =
                '<section class="ghz_section">' +
                    '<h2 class="ghz_section-title">商品参数</h2>' +
                    '<div class="ghz_specs">' + ghz_specsHtml + '</div>' +
                '</section>' +
                (ghz_reviewsHtml
                    ? '<section class="ghz_section">' +
                        '<h2 class="ghz_section-title">用户评价（' + ghz_p.reviews.length + ' 条）</h2>' +
                        '<div class="ghz_reviews">' + ghz_reviewsHtml + '</div>' +
                      '</section>'
                    : '');

            // 缩略图点击切换主图
            var ghz_thumbsBox = ghz_detail.querySelector('.ghz_thumbs');
            var ghz_mainImg = document.getElementById('ghz_main-img');
            var ghz_thumbBtns = ghz_thumbsBox.querySelectorAll('.ghz_thumb');

            for (var ghz_n = 0; ghz_n < ghz_thumbBtns.length; ghz_n++) {
                ghz_thumbBtns[ghz_n].addEventListener('click', function () {
                    ghz_mainImg.src = this.getAttribute('data-ghz-img');

                    for (var ghz_q = 0; ghz_q < ghz_thumbBtns.length; ghz_q++) {
                        ghz_thumbBtns[ghz_q].classList.remove('ghz_thumb--active');
                    }
                    this.classList.add('ghz_thumb--active');
                });
            }
        }

        // 核心：按 ID 请求详情
        async function ghz_loadDetail() {
            ghz_showSkeleton();
            ghz_setState('正在请求商品详情…', 'loading');

            var ghz_start = Date.now();

            try {
                var ghz_response = await fetch(ghz_apiUrl);
                var ghz_cost = Date.now() - ghz_start;

                if (!ghz_response.ok) {
                    throw new Error('HTTP ' + ghz_response.status + '（商品 ID ' + ghz_id + ' 不存在）');
                }

                var ghz_product = await ghz_response.json();

                ghz_render(ghz_product);
                ghz_raw.innerHTML = ghz_highlight(JSON.stringify(ghz_product, null, 2));

                ghz_setState('请求成功：HTTP ' + ghz_response.status + '，耗时 ' + ghz_cost + ' ms', 'ok');
            } catch (ghz_error) {
                var ghz_failCost = Date.now() - ghz_start;

                ghz_detail.innerHTML =
                    '<div class="ghz_empty">' +
                        '<strong>请求失败：' + ghz_escape(ghz_error.message) + '</strong>' +
                        '请确认地址栏中的 id 参数是否正确，或检查网络后刷新页面。' +
                        '<br><a class="ghz_btn" href="./17-3.html">返回商品列表</a>' +
                    '</div>';
                ghz_extra.innerHTML = '';
                ghz_raw.textContent = '请求失败，暂无数据';

                ghz_setState('请求失败：' + ghz_error.message + '，耗时 ' + ghz_failCost + ' ms', 'error');
            }
        }

        ghz_loadDetail();
    </script>
</body>
</html>
