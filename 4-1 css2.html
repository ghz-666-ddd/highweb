<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style> 
        h2,h3,p{
            padding: 0;
            margin: 0;
        }
        #box{
            width: 400px;
            border: 1px solid #5c0404;
            padding: 8px;
            font-size: 12px;
            margin: 20px;
        }
        #box h3{
            font-size: 16px;
            text-align: center;
            letter-spacing: 3px;
            color: #a21818;
            line-height: 150%;
        }
        #box p{
            line-height: 150%;
            color: #666;
            text-indent: 2em;
        }
        #box a{
            color: #1449ce;
            text-decoration: none;
        }
        .knowledge {
            display: inline-block;
            padding: 2px 8px;
            border: 2px solid #8a2be2;
            border-radius: 6px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>css进阶</h2>
    <div id ="box">
        <h3>CSS那些事</h3>
        <p>
            学号:<span style="color: #1449ce; font-weight: bold;">104</span>, 姓名:<span style="color: #054207; font-weight: bold;">高浩哲</span>, 班级:计算机24002,对于《高级网页设计》课程认知为:<span style="color: #ff0000; font-weight: bold;">难</span>,
            这个例子对应的知识点是:<span class="knowledge">群组选择器、后代选择器、层叠与继承</span>。
            <a href="#">更多</a>
        </p>
    </div>
</body>
</html>
