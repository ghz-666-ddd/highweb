<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>高浩哲的JavaScript</h2>
    <script>
        document.write('hello world,高浩哲');
        alert('hello world');
        console.log('hello world');
        //prompt和confirm方法
        var name = prompt('请输入您的姓名');
        alert('您的姓名是：' + name);
        var age = prompt('请输入您的年龄');
        alert('您的年龄是：' + age);
        var isConfirm = confirm('您确定要提交吗？');
        if(isConfirm){
            alert('您已确认提交');
        }else{
            alert('您已取消提交');
        }
    </script>
</body>
