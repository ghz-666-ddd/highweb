<!DOCTYPE html>
<!-- 姓名：高浩哲，日期：2026-10-22，功能：CSS 盒模型 border padding margin 练习 -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒子模型、框模型、box model</title>
    <style>
        body,h2,ul,p{
            padding: 0;
            margin: 0;
        }
        #a{
            width: 400px;
            height: 400px;
            border: 1px solid #039;
            padding: 50px 40px 30px 20px; /*上右下左*/
            margin: 40px auto;
        }
        #b{
            width: 400px;
            height: 400px;
            border: 1px dashed #039;
            margin: 50px auto 40px;
        }
        #c{
            width: 400px;
            height: 400px;
            border: 1px dotted #039;
            margin: 10px;
            padding: 10px;
        }
        #d{
            width: 400px;
            height: 400px;
            border: 1px dotted #039;
            margin: 10px;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div id="a">104 高浩哲</div>
    <div id="b">104 高浩哲</div>
    <div id="c">104 高浩哲</div>
    <div id="d">104 高浩哲</div>
</body>
</html>
