<!DOCTYPE html>
<!-- 姓名：高浩哲，日期：2026-10-22，功能：CSS 选择器层叠样式表 -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>104 高浩哲</title>
    <style>
        p{
            color: brown;
            font-size:50px;
        }
        /* 标签选择器 */
        #ghz_box{
            width: 600px; 
            height: 500px;
            background-color: #ccc;
        }
        /* id选择器，以#开头 */
        .ghz_n1{
            color: blue;
        }
        /* 扩展2 h2黑底白字 */
        h2 {
            background-color: black;
            color: white;
        }
        /* 扩展3 选择器文字白色 */
        .ghz_white-text{
            color:#fff;
        }
        /* 扩展1 名字每个字单独颜色 */
        .ghz_char1{
            color:blue;
        }
        .ghz_char2{
            color:red;
        }
        .ghz_char3{
            color:green;
        }
        /* 新增：宽300高300盒子 */
        .ghz_box-new{
            width: 300px;
            height: 300px;
            background-color: orange;
        }
    </style>
</head>
<body>
    <h2>层叠样式表 css </h2>
    <div id="ghz_box">
        <p>css<span class="ghz_white-text">选择器</span></p>
        <!-- 扩展1：名字每个字不同颜色，在同一行 -->
        <p>
            <span class="ghz_char1">高</span>
            <span class="ghz_char2">浩</span>
            <span class="ghz_char3">哲</span>
        </p>
        <p>css属性</p>
    </div>    

    <!-- 新增300*300盒子 -->
    <div class="ghz_box-new"></div>

 <!-- 扩展1：名字的每个字不同颜色，在同一行 -->
<!-- 扩展2：h2黑底白字 -->
<!-- 扩展3：选择器三字字是白色 -->
</body>
</html>
