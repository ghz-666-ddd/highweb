<!DOCTYPE html>
<!-- 姓名：高浩哲，日期：2026-10-22，功能：CSS 层叠与继承优先级练习 -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            color: red;
            font-size: 100px;
        }
        .ghz_text{
            color: green;
        }
        #ghz_text{
            color: purple;
        }
        .ghz_box p{
            color: orange;
        }
        #ghz_box #ghz_text{
            color: silver;
        }
        .ghz_text{
            color: yellow!important;
        }
        #ghz_box {
            width: 1500px;
            height: 400px;
            background-color:gray;
            margin: 10px;
            padding: 10px;
            letter-spacing: 25px;
            /*圆角矩形50%*/
            border-radius: 50%;
        }
        /*优先级id>class>标签*/
    </style>
    <link rel="stylesheet" href="css.css">
</head>
<body>
    <h2>层叠与继承</h2>
    <div id="ghz_box" class="ghz_box">
        <p id="ghz_text"class="ghz_text">104高浩哲</p>
        <p>层叠与继承</p>
    </div>
</body>
</html>
